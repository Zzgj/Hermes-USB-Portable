name: Portable initializer

on:
  push:
    branches:
      - main
      - feat/portable-initializer
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-powershell:
    name: Windows / PowerShell 5.1
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Test PowerShell file entrypoints
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $hostExecutable = (Get-Process -Id $PID).Path
          $testScripts = @(
            ".\tests\portable-initializer.Tests.ps1",
            ".\tests\runtime-component-lock.Tests.ps1",
            ".\tests\runtime-filesystem.Tests.ps1",
            ".\tests\runtime-setup-state.Tests.ps1",
            ".\tests\portable-update-state.Tests.ps1",
            ".\tests\portable-launcher.Tests.ps1",
            ".\tests\reset-windows.Tests.ps1",
            ".\tests\update-case-collision.Tests.ps1",
            ".\tests\portable-location.Tests.ps1",
            ".\tests\p0-package.Tests.ps1",
            ".\tests\log-layout.Tests.ps1"
          )
          foreach ($testScript in $testScripts) {
            & $hostExecutable -NoLogo -NoProfile -ExecutionPolicy Bypass -File $testScript
            if ($LASTEXITCODE -ne 0) {
              throw "Test entrypoint failed with exit code $LASTEXITCODE`: $testScript"
            }
          }

  windows-pwsh:
    name: Windows / PowerShell 7
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Test PowerShell file entrypoints
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $hostExecutable = (Get-Process -Id $PID).Path
          $testScripts = @(
            ".\tests\portable-initializer.Tests.ps1",
            ".\tests\runtime-component-lock.Tests.ps1",
            ".\tests\runtime-filesystem.Tests.ps1",
            ".\tests\runtime-setup-state.Tests.ps1",
            ".\tests\portable-update-state.Tests.ps1",
            ".\tests\portable-launcher.Tests.ps1",
            ".\tests\reset-windows.Tests.ps1",
            ".\tests\update-case-collision.Tests.ps1",
            ".\tests\portable-location.Tests.ps1",
            ".\tests\p0-package.Tests.ps1",
            ".\tests\log-layout.Tests.ps1"
          )
          foreach ($testScript in $testScripts) {
            & $hostExecutable -NoLogo -NoProfile -ExecutionPolicy Bypass -File $testScript
            if ($LASTEXITCODE -ne 0) {
              throw "Test entrypoint failed with exit code $LASTEXITCODE`: $testScript"
            }
          }

  p0-package:
    name: P0 candidate package
    needs: [windows-powershell, windows-pwsh]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Build source-only candidate
        run: python3 scripts/build-p0-package.py --output /tmp/p0-package
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Hermes-Portable-P0-RC1
          path: /tmp/p0-package/*
          if-no-files-found: error
